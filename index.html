<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="셰이더만으로 그린 투명 주얼 케이스. 모델 파일 없이 three.js와 GLSL로 플라스틱의 굴절, 디스크의 회절 무지개, 뚜껑 여닫는 움직임을 만들었습니다." />
    <title>Jewel Case</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23101014'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%237fd6ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="stage"></div>
      <p class="fail" id="fail" hidden>이 페이지는 WebGL 2(부동소수 렌더 타깃)가 필요한데, 이 브라우저에서는 시작하지 못했어요.</p>
      <p class="sr" id="live" aria-live="polite"></p>

      <header class="corner">
        <h1>Jewel Case</h1>
        <p>three.js + GLSL · 모델 파일 없음</p>
      </header>

      <p class="hint" aria-hidden="true">케이스를 누르면 열려요 · 끌어서 돌려보세요</p>

      <nav class="dock" aria-label="디스크 고르기">
        <div class="rail" id="rail"></div>
        <span class="rule" aria-hidden="true"></span>
        <button type="button" class="tool" id="spin" aria-label="디스크 회전" aria-pressed="true" title="디스크 회전 (S)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.25" />
            <circle cx="12" cy="12" r="1.7" />
            <path d="M5.9 9.4a6.6 6.6 0 0 1 3.5-3.5M18.1 14.6a6.6 6.6 0 0 1-3.5 3.5" />
          </svg>
        </button>
        <button type="button" class="tool" id="open" aria-label="케이스 열기" aria-pressed="false" title="열기 / 닫기 (O)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4.2" y="10.8" width="15.6" height="8.6" rx="1.8" />
            <path d="M4.6 9.3 18 4.4M9.2 15.1h5.6" />
          </svg>
        </button>
        <button type="button" class="tool" id="pause" aria-label="자동 재생 멈춤" aria-pressed="false" title="자동 재생 (space)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <g class="bars"><rect x="6.2" y="5" width="4.1" height="14" rx="1.1" /><rect x="13.7" y="5" width="4.1" height="14" rx="1.1" /></g>
            <path class="play" d="M8 5.1v13.8a.7.7 0 0 0 1.07.6l10.6-6.9a.7.7 0 0 0 0-1.2L9.07 4.5A.7.7 0 0 0 8 5.1z" />
          </svg>
        </button>
      </nav>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
